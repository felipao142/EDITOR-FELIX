<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FELIX — Creative Video Editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="home" class="scr"><h1> Studio de Vídeo</h1><div class="hint">Seus projetos ficam salvos neste navegador.</div><div class="grid" id="grid"></div></div>
<div id="ed" class="scr">
<header>
<span class="logo">FELIX.</span><button class="ic" onclick="parent.postMessage('felix:back','*')" title="Voltar ao site">⌂</button><button onclick="back()">← Projetos</button><span id="pn" title="Renomear"></span>
<button onclick="ieStart()" title="Editor de imagem (ajustes, curvas, remover fundo...)">🖌 Imagem</button><button class="ic" onclick="help()" title="Atalhos">?</button><button class="p" id="ex" onclick="exp()">⬇ Exportar</button>
<input type="file" id="fi" accept="video/*,image/*,audio/*,.gif" multiple hidden>
</header>
<aside id="side"><button class="shx" onclick="sheet()">✕</button><div class="tabs" id="stabs"></div><div class="pane" id="spane"></div></aside>
<section id="prev"><div class="phead">Player</div><div class="stage" id="stage"><canvas id="cv" width="1280" height="720"></canvas><div id="gd"></div><div id="bx"><i data-c="nw"></i><i data-c="ne"></i><i data-c="se"></i><i data-c="sw"></i></div></div>
<div id="ctl"><div class="ca"><span id="tm">00:00:00:00 / 00:00:00:00</span></div>
<div class="cb"><button class="ic" onclick="t=0" title="Início">⏮</button><button class="ic" onclick="step(-1)" title="−1 frame">◀|</button><button class="ic p" id="pp" onclick="toggle()">▶</button><button class="ic" onclick="step(1)" title="+1 frame">|▶</button></div>
<div class="cc"><button class="ic" id="lp" onclick="loop=!loop;this.classList.toggle('on',loop)" title="Repetir">🔁</button><button class="ic" id="gb" onclick="guides()" title="Guias de segurança">▦</button><button class="ic" onclick="shot()" title="Salvar frame">📷</button><button class="ic" onclick="fs2()" title="Tela cheia">⛶</button><select id="ar" onchange="setAr();save()" title="Proporção"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option></select></div></div></section>
<aside id="insp"><button class="shx" onclick="sheet()">✕</button><div class="tabs" id="itabs"></div><div class="pane" id="ipane"></div></aside>
<section id="tlbox"><div id="tlbar"><button class="ic" onclick="undo(-1)" title="Desfazer (Ctrl+Z)">↶</button><button class="ic" onclick="undo(1)" title="Refazer (Ctrl+Y)">↷</button><span class="sep"></span>
<button onclick="split()" title="Dividir (S)">✂<em>Dividir</em></button><button onclick="dup()" title="Duplicar">⧉<em>Duplicar</em></button><button onclick="del()" title="Apagar">🗑<em>Apagar</em></button><button onclick="addKfBtn()" title="Keyframe (K)">◆<em>Keyframe</em></button><span class="sep"></span>
<button id="snb" class="on ic" onclick="snap=!snap;this.classList.toggle('on',snap)" title="Ímã">🧲</button><span style="flex:1"></span><span class="hint" id="info"></span><label class="hint" style="display:flex;align-items:center;gap:6px">⌕<input type="range" min="15" max="220" value="50" style="width:120px" oninput="zoom=+this.value;rTL()"></label></div>
<div id="tlmain"><div id="heads"></div><div id="tlw"><div id="tl"></div></div></div></section>
<nav id="mbar"></nav>
</div>
<div id="ie"><div class="ieh"><b>Editor de imagem</b><button onclick="$('ief').click()">📂 Abrir</button><button onclick="ieUndo(-1)" title="Desfazer">↶</button><button onclick="ieUndo(1)" title="Refazer">↷</button><button onpointerdown="IE.before=1;ieR()" onpointerup="IE.before=0;ieR()" onpointerleave="if(IE.before){IE.before=0;ieR()}">👁 Antes</button><span style="flex:1"></span><button onclick="ieSave()">⬇ PNG</button><button class="p" onclick="ieApply()">✔ Aplicar ao projeto</button><button onclick="$('ie').style.display='none'">✕</button><input type="file" id="ief" accept="image/*" hidden></div>
<div class="iew"><div id="iet"></div><div class="iec"><canvas id="ic"></canvas><div id="icr"></div></div><div id="iep"></div></div></div>
<div id="md"></div><div id="toast"></div>
<script src="editor.js"></script>
</body>
</html>
